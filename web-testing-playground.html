<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steuerchat - Web Testing Playground</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Socket.io Client CDN -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        :root {
            --bg-dark: #04060f;
            --bg-card: rgba(255, 255, 255, 0.03);
            --primary: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --accent-stop: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --status-connected: #10b981;
            --status-offline: #ef4444;
            --status-reconnecting: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: 
                radial-gradient(circle at 15% 20%, rgba(0, 242, 254, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(79, 172, 254, 0.04) 0%, transparent 40%),
                var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background: rgba(10, 15, 30, 0.65);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            animation: app-fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes app-fade-in {
            from { opacity: 0; transform: scale(0.97) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Header styling */
        header {
            padding: 24px 20px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
        }

        .header-title h1 {
            font-size: 1.35rem;
            font-weight: 700;
            background: var(--primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-title p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 3px;
            font-weight: 500;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.2px;
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background-color: var(--status-connected);
            animation: greenGlow 2s infinite alternate;
        }

        .status-dot.offline {
            background-color: var(--status-offline);
            animation: redGlow 2s infinite alternate;
        }

        .status-dot.reconnecting {
            background-color: var(--status-reconnecting);
            animation: amberGlow 1s infinite alternate;
        }

        @keyframes greenGlow {
            0% { box-shadow: 0 0 6px rgba(16, 185, 129, 0.4); transform: scale(0.9); }
            100% { box-shadow: 0 0 14px rgba(16, 185, 129, 0.8), 0 0 20px rgba(16, 185, 129, 0.4); transform: scale(1.1); }
        }

        @keyframes redGlow {
            0% { box-shadow: 0 0 6px rgba(239, 68, 68, 0.4); transform: scale(0.9); }
            100% { box-shadow: 0 0 14px rgba(239, 68, 68, 0.8); transform: scale(1.1); }
        }

        @keyframes amberGlow {
            0% { box-shadow: 0 0 6px rgba(245, 158, 11, 0.4); transform: scale(0.9); }
            100% { box-shadow: 0 0 14px rgba(245, 158, 11, 0.8); transform: scale(1.2); }
        }

        /* Simulator controller */
        .simulator-bar {
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .simulator-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .simulator-btn:hover:not(:disabled) {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
            border-color: transparent;
        }

        .simulator-btn:disabled {
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.03);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Chat history area */
        .chat-history {
            flex: 1;
            padding: 24px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .chat-history::-webkit-scrollbar {
            width: 4px;
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        .chat-history::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: bubble-entrance 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes bubble-entrance {
            from { opacity: 0; transform: translateY(12px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.bot {
            align-self: flex-start;
            align-items: flex-start;
        }

        .bubble {
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.92rem;
            line-height: 1.45;
            word-break: break-word;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .message.user .bubble {
            background: var(--primary);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 8px 24px rgba(0, 242, 254, 0.15);
            font-weight: 500;
        }

        .message.bot .bubble {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .bubble.text-placeholder {
            animation: breathing 0.8s infinite alternate ease-in-out;
            color: #00f2fe;
            font-size: 1.1rem;
            padding: 10px 24px;
        }

        @keyframes breathing {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.1); }
        }

        .timestamp {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 5px;
            padding: 0 6px;
            font-weight: 500;
        }

        .streaming-indicator {
            font-size: 0.78rem;
            color: #00f2fe;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 20px 10px 20px;
            font-weight: 600;
            animation: fade 1.2s infinite alternate ease-in-out;
        }

        @keyframes fade {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Input section */
        .input-area {
            padding: 16px 20px 30px 20px;
            background: rgba(8, 12, 24, 0.85);
            border-top: 1px solid var(--border);
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
        }

        .form-container {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 14px 18px;
            border-radius: 16px;
            color: #fff;
            font-family: inherit;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        input[type="text"]:focus {
            border-color: #00f2fe;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 16px rgba(0, 242, 254, 0.1);
        }

        input[type="text"]:disabled {
            color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.8;
        }

        .btn {
            padding: 14px 22px;
            border-radius: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 0.92rem;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-send {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.15);
        }

        .btn-send:hover:not(:disabled) {
            transform: translateY(-1.5px);
            box-shadow: 0 8px 24px rgba(0, 242, 254, 0.3);
        }

        .btn-send:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-send:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.15);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-stop {
            background: var(--accent-stop);
            color: #fff;
            width: 100%;
            box-shadow: 0 6px 20px rgba(255, 8, 68, 0.2);
            animation: pulse-stop-btn 1.5s infinite alternate ease-in-out;
        }

        @keyframes pulse-stop-btn {
            0% { box-shadow: 0 6px 16px rgba(255, 8, 68, 0.15); }
            100% { box-shadow: 0 6px 24px rgba(255, 8, 68, 0.35); }
        }

        .btn-stop:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 8px 24px rgba(255, 8, 68, 0.35);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-title">
            <h1>Steuerchat</h1>
            <p>Web testing playground</p>
        </div>
        <div class="status-badge">
            <span id="status-dot" class="status-dot offline"></span>
            <span id="status-text">Offline</span>
        </div>
    </header>

    <!-- Simulator controller bar -->
    <div class="simulator-bar">
        <span>Simulate 5s Airplane Mode disconnect:</span>
        <button id="btn-simulate" class="simulator-btn" disabled>Simulate</button>
    </div>

    <!-- Message history list -->
    <div id="chat-history" class="chat-history">
        <!-- Welcoming placeholder -->
        <div class="message bot">
            <div class="bubble">
                Hello! This is an interactive web client built to verify your NestJS websocket streaming backend. Make sure your server is running on port 3000, then try sending a message!
            </div>
            <div class="timestamp">Just now</div>
        </div>
    </div>

    <div id="streaming-label" class="streaming-indicator" style="display: none;">
        <span>⚡ Streaming response...</span>
    </div>

    <!-- Input footer -->
    <div class="input-area">
        <div class="form-container">
            <input type="text" id="input-message" placeholder="Type a message..." autocomplete="off">
            <button id="btn-action" class="btn btn-send" disabled>Send</button>
        </div>
    </div>
</div>

<script>
    const socketUrl = 'http://localhost:3000';
    let socket;
    
    // Persistent Session UUID in localStorage
    let sessionId = localStorage.getItem('webPlaygroundSessionId');
    if (!sessionId) {
        sessionId = 'web_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('webPlaygroundSessionId', sessionId);
    }
    
    let activeMessageId = null;
    let lastReceivedIndex = -1;
    let isStreaming = false;

    // DOM References
    const chatHistory = document.getElementById('chat-history');
    const inputMessage = document.getElementById('input-message');
    const btnAction = document.getElementById('btn-action');
    const btnSimulate = document.getElementById('btn-simulate');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const streamingLabel = document.getElementById('streaming-label');

    // Initialize connection
    function connectSocket() {
        updateStatus('connecting', 'Connecting...');
        
        socket = io(socketUrl, {
            query: { sessionId },
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 3000,
            timeout: 5000
        });

        // Native socket lifecycle events
        socket.on('connect', () => {
            console.log('Socket connected successfully!');
            updateStatus('connected', 'Connected');
            btnSimulate.disabled = false;
            
            // Check if we need to resume an interrupted stream
            if (isStreaming && activeMessageId) {
                console.log(`Auto-resuming session ${sessionId} from index ${lastReceivedIndex}`);
                socket.emit('resume_stream', { sessionId, lastReceivedIndex });
            }
        });

        socket.on('disconnect', () => {
            console.log('Socket disconnected!');
            updateStatus('offline', 'Offline');
            btnSimulate.disabled = true;
        });

        socket.on('connect_error', () => {
            updateStatus('offline', 'Offline');
            btnSimulate.disabled = true;
        });

        // Predefined Chat events
        socket.on('stream_chunk', (data) => {
            console.log('Received chunk:', data);
            const { messageId, chunkIndex, text, isFinished } = data;
            
            if (activeMessageId !== messageId) {
                activeMessageId = messageId;
                lastReceivedIndex = -1;
                setStreamingState(true);
                // Create new bot message container
                createBotMessagePlaceholder(messageId);
            }

            // Verify order
            if (chunkIndex > lastReceivedIndex) {
                lastReceivedIndex = chunkIndex;
                appendChunkToMessage(messageId, text);

                if (isFinished) {
                    setStreamingState(false);
                    activeMessageId = null;
                    lastReceivedIndex = -1;
                }
            }
        });

        socket.on('stream_cancelled', (data) => {
            console.log('Stream cancelled:', data);
            if (data.messageId === activeMessageId || activeMessageId) {
                markMessageAsCancelled(activeMessageId || data.messageId);
                setStreamingState(false);
                activeMessageId = null;
                lastReceivedIndex = -1;
            }
        });

        socket.on('stream_error', (data) => {
            console.error('Stream error:', data);
            const errorMsg = data.error || 'An unexpected error occurred.';
            if (activeMessageId || data.messageId) {
                markMessageAsError(activeMessageId || data.messageId, errorMsg);
            } else {
                appendSystemMessage(`❌ Error: ${errorMsg}`);
            }
            setStreamingState(false);
            activeMessageId = null;
            lastReceivedIndex = -1;
        });
    }

    // Connect immediately
    connectSocket();

    // Event Listeners
    inputMessage.addEventListener('input', () => {
        if (!isStreaming) {
            btnAction.disabled = inputMessage.value.trim() === '';
        }
    });

    inputMessage.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !btnAction.disabled) {
            handleAction();
        }
    });

    btnAction.addEventListener('click', handleAction);

    btnSimulate.addEventListener('click', () => {
        if (!socket || !socket.connected) return;
        
        console.log('Simulating 5-second airplane mode disconnect...');
        btnSimulate.disabled = true;
        
        // Manually close connection
        socket.disconnect();
        updateStatus('offline', 'Offline (Simulated)');
        
        // Append system notification to chat
        appendSystemMessage("⚠️ Connection lost. Simulating 5s offline state...");
        
        // Wait 5 seconds, then reconnect
        setTimeout(() => {
            appendSystemMessage("⚡ Network recovered. Reconnecting...");
            socket.connect();
        }, 5000);
    });

    // Handle Send / Stop Action
    function handleAction() {
        if (isStreaming) {
            // Send cancellation
            if (activeMessageId) {
                socket.emit('cancel_stream', { sessionId, messageId: activeMessageId });
                // Optimistically cancel UI
                markMessageAsCancelled(activeMessageId);
                setStreamingState(false);
                activeMessageId = null;
                lastReceivedIndex = -1;
            }
        } else {
            const text = inputMessage.value.trim();
            if (!text) return;

            const userMsgId = 'user_' + Date.now();
            const botMsgId = 'bot_' + Date.now();

            // Append User Message to UI
            appendUserMessage(text);
            inputMessage.value = '';
            btnAction.disabled = true;

            // Prepare UI state for bot streaming
            activeMessageId = botMsgId;
            lastReceivedIndex = -1;
            setStreamingState(true);
            
            // Create bot message in UI
            createBotMessagePlaceholder(botMsgId);

            // Emit to server
            socket.emit('send_message', {
                sessionId,
                messageId: botMsgId,
                text
            });
        }
    }

    // UI Helper Functions
    function updateStatus(state, label) {
        statusDot.className = `status-dot ${state}`;
        statusText.innerText = label;
    }

    function setStreamingState(streaming) {
        isStreaming = streaming;
        if (streaming) {
            streamingLabel.style.display = 'flex';
            btnAction.className = 'btn btn-stop';
            btnAction.innerText = 'Stop';
            btnAction.disabled = false;
            inputMessage.disabled = true;
            inputMessage.placeholder = 'Streaming, controls locked...';
        } else {
            streamingLabel.style.display = 'none';
            btnAction.className = 'btn btn-send';
            btnAction.innerText = 'Send';
            btnAction.disabled = inputMessage.value.trim() === '';
            inputMessage.disabled = false;
            inputMessage.placeholder = 'Type a message...';
            inputMessage.focus();
        }
    }

    function appendUserMessage(text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message user';
        msgDiv.innerHTML = `
            <div class="bubble">${escapeHTML(text)}</div>
            <div class="timestamp">${getCurrentTime()}</div>
        `;
        chatHistory.appendChild(msgDiv);
        scrollToBottom();
    }

    function createBotMessagePlaceholder(messageId) {
        if (document.getElementById(`msg-${messageId}`)) {
            return;
        }
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message bot';
        msgDiv.id = `msg-${messageId}`;
        msgDiv.innerHTML = `
            <div class="bubble text-placeholder">●</div>
            <div class="timestamp">${getCurrentTime()}</div>
        `;
        chatHistory.appendChild(msgDiv);
        scrollToBottom();
    }

    function appendChunkToMessage(messageId, chunk) {
        const msgDiv = document.getElementById(`msg-${messageId}`);
        if (!msgDiv) return;

        const bubble = msgDiv.querySelector('.bubble');
        if (bubble.classList.contains('text-placeholder')) {
            bubble.classList.remove('text-placeholder');
            bubble.innerText = chunk;
        } else {
            // Spacing filter for punctuation marks
            const punctuations = ['.', ',', '!', '?', ';', ':'];
            if (punctuations.includes(chunk)) {
                bubble.innerText += chunk;
            } else {
                bubble.innerText += ' ' + chunk;
            }
        }
        scrollToBottom();
    }

    function markMessageAsCancelled(messageId) {
        const msgDiv = document.getElementById(`msg-${messageId}`);
        if (!msgDiv) return;

        const bubble = msgDiv.querySelector('.bubble');
        if (bubble.classList.contains('text-placeholder')) {
            bubble.classList.remove('text-placeholder');
            bubble.innerText = '🛑 [Stream Stopped]';
        } else {
            bubble.innerText += ' 🛑 [Stream Stopped]';
        }
        scrollToBottom();
    }

    function markMessageAsError(messageId, errorMessage) {
        const msgDiv = document.getElementById(`msg-${messageId}`);
        if (!msgDiv) return;

        const bubble = msgDiv.querySelector('.bubble');
        if (bubble.classList.contains('text-placeholder')) {
            bubble.classList.remove('text-placeholder');
            bubble.innerText = `❌ Error: ${errorMessage}`;
        } else {
            bubble.innerText += ` ❌ Error: ${errorMessage}`;
        }
        bubble.style.borderColor = 'rgba(239, 68, 68, 0.4)';
        bubble.style.background = 'rgba(239, 68, 68, 0.08)';
        bubble.style.color = '#ef4444';
        scrollToBottom();
    }

    function appendSystemMessage(text) {
        const sysDiv = document.createElement('div');
        sysDiv.style.alignSelf = 'center';
        sysDiv.style.fontSize = '0.75rem';
        sysDiv.style.color = '#ef4444';
        sysDiv.style.background = 'rgba(239, 68, 68, 0.05)';
        sysDiv.style.padding = '4px 12px';
        sysDiv.style.borderRadius = '50px';
        sysDiv.style.border = '1px solid rgba(239, 68, 68, 0.1)';
        sysDiv.innerText = text;
        
        chatHistory.appendChild(sysDiv);
        scrollToBottom();
    }

    function scrollToBottom() {
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function getCurrentTime() {
        const now = new Date();
        return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>
</body>
</html>
